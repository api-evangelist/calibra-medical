name: Calibra Medical
description: 'Calibra Medical, Inc. was a Redwood City, California medical device company
  founded in 2004 to make mealtime insulin therapy simpler and more discreet. Its product
  was the Finesse "patch-pen", a fully mechanical, three-day wearable bolus insulin delivery
  patch (roughly 2 x 1 x 0.25 inches, 200-unit reservoir, no batteries, display, or handheld
  controller) dosed by pressing two buttons. Backed by Canaan Partners, Frazier Healthcare
  Partners, Intersouth Partners, Skyline Ventures, and Three Arch Partners, the company raised
  approximately $61.5M before Johnson & Johnson acquired it in a reported $77M all-cash deal
  in 2012, folding it into the J&J Diabetes Care Companies. J&J rebranded the device OneTouch
  Via but never commercially launched it, and on July 17, 2018 sold select Calibra Medical
  assets and an exclusive worldwide license to Swiss wearable-insulin firm CeQur. Calibra
  Medical no longer operates as an independent company: it publishes no developer portal,
  no API, and no public source repositories, and the calibramedical.com domain now resolves
  to a parked "domain may be for sale" page. This profile is retained as a historical
  medical-device company record with no API surface.'
